name: Auto-Sync Facebook Events

on:
  schedule:
    - cron: '30 0 * * *' # Runs at 00:30 UTC daily to stagger with untappd
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Fetch and Sync Events
        env:
          EVENTS_ICS_URL: ${{ vars.EVENTS_ICS_URL }}
        run: npm run sync-events

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes in the specific data directory
          if git diff --exit-code src/data/events.json; then
            # We also need to check if there are new untracked or modified images
            if [[ -z $(git status -s public/images/events/) ]]; then
              echo "No changes to events or images."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Data changed, committing..."
          git add src/data/events.json public/images/events/
          git commit -m "Auto-update events data"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
